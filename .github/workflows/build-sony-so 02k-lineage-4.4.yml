name: Build Sony SO-02K Lineage 17.1 Kernel

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "sony_xz1c"
  DEVICE_CODENAME: "so-02k"
  # 若ls看不到so02k_defconfig，改成 sony_xz1c_defconfig
  DEFCONFIG_NAME: "so02k_defconfig"
  ARCH: arm64

  CLANG_TARGET_TRIPLE: "aarch64-linux-android"
  CLANG_TRIPLE: "aarch64-linux-android"
  EXTRA_CMDS: LD=ld.lld LLVM=1 CROSS_COMPILE=aarch64-linux-android- ARCH=arm64 SUBARCH=arm64 KBUILD_CFLAGS=-Wno-incompatible-pointer-types -Wno-unused-parameter -Wno-array-bounds -j$(nproc)
  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  KERNEL_SOURCE: "https://github.com/whatawurst/android_kernel_sony_msm8998.git"
  KERNEL_BRANCH: "lineage-17.1"

  GCC_GNU: false
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "false"
  KERNELSU_METHOD: "none"
  SUSFS_ENABLE: false
  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"
  PYTHON_VERSION: "3"
  REKERNEL_ENABLE: "true"
  HOOK_METHOD: "syscall"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: ⏰ Checkout Workflow Repository
        uses: actions/checkout@v6

      # 系统预装Clang14，彻底解决gzip解压报错
      - name: Install Clang 14 & Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y clang-14 lld-14 llvm-14 git ccache make zip gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld

      # 拉取内核与AnyKernel3源码
      - name: Clone Kernel & AnyKernel3
        run: |
          git clone -b $KERNEL_BRANCH $KERNEL_SOURCE $GITHUB_WORKSPACE/device_kernel
          git clone -b $AK3_BRANCH $AK3_SOURCE $GITHUB_WORKSPACE/anykernel3

      # 源码清理
      - name: 🧹 Full Source Deep Clean
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clean -fdx
          make mrproper
          rm -rf out .config include/config generated arch/*/include/generated

      # 调试：查看defconfig列表与Kconfig内容
      - name: Check defconfig existence
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          echo "==== Available defconfigs ===="
          ls arch/arm64/configs/
          echo "==== drivers/Kconfig ===="
          cat drivers/Kconfig

      # 生成配置：注释KSU配置，不删除行防止语法报错
      - name: ⚙️ Generate Defconfig & Modify CPU Count
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's|source "drivers/kernelsu/Kconfig"|# source "drivers/kernelsu/Kconfig"|' drivers/Kconfig
          make ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=16/' .config
          make ARCH=${{ env.ARCH }} olddefconfig

      # 内核编译
      - name: 🚀 Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          export ${{ env.EXTRA_CMDS }}
          make -j$(nproc)

      # AnyKernel3打包刷机包
      - name: Pack Flashable Zip
        run: |
          cp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/anykernel3/
          cd $GITHUB_WORKSPACE/anykernel3
          zip -r SO02K-Kernel.zip . -x ".git*"

      # 官方上传artifact，修复找不到本地action报错
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: SO-02K-Kernel-Flashable
          path: $GITHUB_WORKSPACE/anykernel3/SO02K-Kernel.zip