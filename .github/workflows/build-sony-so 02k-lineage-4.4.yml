name: Build Sony SO-02K Lineage 17.1 Kernel

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME: "sony_xz1c"
  DEVICE_CODENAME: "so-02k"
  DEFCONFIG_NAME: "so02k_defconfig"
  ARCH: arm64

  CLANG_TARGET_TRIPLE: "aarch64-linux-android"
  CLANG_TRIPLE: "aarch64-linux-android"
  EXTRA_CMDS: LD=ld.lld LLVM=1 CROSS_COMPILE=aarch64-linux-android- ARCH=arm64 SUBARCH=arm64 KBUILD_CFLAGS=-Wno-incompatible-pointer-types -Wno-unused-parameter -Wno-array-bounds -j$(nproc)
  CLANG_SOURCE: ""
  CLANG_BRANCH: ""

  KERNEL_SOURCE: "https://github.com/whatawurst/android_kernel_sony_msm8998.git"
  KERNEL_BRANCH: "lineage-17.1"

  GCC_GNU: false
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "false"
  KERNELSU_AUTO_FORK: ""
  KERNELSU_METHOD: "none"

  SUSFS_ENABLE: false
  SUSFS_FIXED: false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  BOOT_SOURCE: ""
  NEED_DTBO: false
  NEED_SAFE_DTBO: false
  ROM_TEXT: "rom_android"
  PYTHON_VERSION: "3"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  REKERNEL_ENABLE: "true"
  DROIDSPACES_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"
  FREE_MORE_SPACE: "false"

  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: ⏰ Checkout Workflow Repository
        uses: actions/checkout@v6

      # 本地安装Clang14，彻底消除下载压缩包gzip报错
      - name: Install Clang 14
        run: |
          sudo apt update -y
          sudo apt install -y clang-14 lld-14 llvm-14 git ccache make gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld

      # 拉取内核源码 & AnyKernel3
      - name: Clone Kernel & AnyKernel3
        run: |
          git clone -b $KERNEL_BRANCH $KERNEL_SOURCE $GITHUB_WORKSPACE/device_kernel
          git clone -b $AK3_BRANCH $AK3_SOURCE $GITHUB_WORKSPACE/anykernel3

      # 源码深度清理
      - name: 🧹 Full Source Deep Clean
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clean -fdx
          make mrproper
          rm -rf out .config include/config generated arch/*/include/generated

      # 移除KSU引用
      - name: ⚙️ Generate Defconfig & Modify CPU Count
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          make ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=16/' .config
          make ARCH=${{ env.ARCH }} olddefconfig

      # 内核编译
      - name: 🚀 Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          export ${{ env.EXTRA_CMDS }}
          make -j$(nproc)

      # AnyKernel3打包
      - name: Pack AnyKernel3 Zip
        run: |
          cp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/anykernel3/
          cd $GITHUB_WORKSPACE/anykernel3
          zip -r kernel-so02k.zip . -x ".git*"

      # 上传刷机包
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: SO-02K-Kernel
          path: $GITHUB_WORKSPACE/anykernel3/kernel-so02k.zip