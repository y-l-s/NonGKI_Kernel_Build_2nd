name: Build Sony so 02k lineage 4.4

on:
  workflow_call:
  workflow_dispatch:

env:
  DEVICE_NAME : "sony_xz1c"
  DEVICE_CODENAME : "so-02k"
  DEFCONFIG_NAME : "so02k_defconfig"
  CLANG_TARGET_TRIPLE: "aarch64-linux-android"
  CLANG_TRIPLE: "aarch64-linux-android"
  EXTRA_CMDS : "LD=ld.lld LLVM=1 LLVM_IAS=1 ARCH=arm64 SUBARCH=arm64 KBUILD_CFLAGS='-Wno-incompatible-pointer-types -Wno-unused-parameter' -j$(nproc)"

  KERNEL_SOURCE : "https://github.com/whatawurst/android_kernel_sony_msm8998.git"
  KERNEL_BRANCH : "lineage-17.1"
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # 完全关闭KernelSU，且不调用KSU子补丁脚本
  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""
  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : "resukisu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE : false
  SUSFS_FIXED : false
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"
  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  BOOT_SOURCE : ""
  NEED_DTBO : false
  NEED_SAFE_DTBO : false
  ROM_TEXT : "rom_android"
  PYTHON_VERSION: "3"

  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""
  REKERNEL_ENABLE: "true"
  DROIDSPACES_ENABLE: "false"
  HOOK_METHOD: "syscall"
  KERNEL_PATCH: "false"
  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"
  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"
  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: "vendor/debugfs.config,vendor/lahaina_QGKI.config"
  FREE_MORE_SPACE: "false"

  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools (clone kernel + anykernel3)
        uses: ./.github/workflows/build-ready

      # 全局深度清理，解决源码dirty报错
      - name: Full source clean (fix dirty source error)
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clean -fdx
          make mrproper
          rm -rf out .config include/config generated arch/*/include/generated
          rm -rf $GITHUB_WORKSPACE/clang-custom $GITHUB_WORKSPACE/gcc-64 $GITHUB_WORKSPACE/gcc-32

      # 仅保留非KSU补丁，彻底移除patch-kernelsu调用
      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🛠️ Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      # 提前删除Kconfig内kernelsu引用，规避defconfig文件缺失
      - name: Fix NR_CPUS & Generate .config
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          make ARCH=arm64 ${{ env.DEFCONFIG_NAME }}
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=16/' .config
          make ARCH=arm64 olddefconfig

      # 编译前二次清理输出目录
      - name: Double clean output dir before build
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          make mrproper
          rm -rf out

      # 内核编译，关闭dirty校验、清空GCC交叉变量
      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process
        env:
          CLANG_TARGET_TRIPLE: ${{ env.CLANG_TARGET_TRIPLE }}
          CLANG_TRIPLE: ${{ env.CLANG_TRIPLE }}
          EXTRA_BUILD_ARGS: "CLANG_TARGET_TRIPLE=${{ env.CLANG_TARGET_TRIPLE }} CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} ${{ env.EXTRA_CMDS }}"
          GCC_64: ""
          GCC_32: ""
          KBUILD_OUTPUT_CHECK: "0"

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files